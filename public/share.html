<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>分享的笔记 · 记事簿</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/style.css">
  <script src="/theme.js"></script>
</head>
<body class="share-body">
  <div class="share-wrap">

    <!-- 密码门 -->
    <div id="gate" class="hidden">
      <form class="share-gate-card" id="gate-form">
        <div class="lock-ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </div>
        <h2>此内容已加锁</h2>
        <p>请输入访问密码继续查看</p>
        <input type="password" id="gate-pw" placeholder="访问密码" autocomplete="off">
        <div class="form-error" id="gate-err"></div>
        <button class="btn btn-primary btn-block" type="submit">查 看</button>
      </form>
    </div>

    <!-- 内容 -->
    <div id="content" class="hidden">
      <div class="share-head">
        <h1 id="s-title"></h1>
        <button class="icon-btn print-btn no-print" id="print-btn" type="button" title="打印">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        </button>
      </div>
      <div class="share-meta" id="s-meta"></div>
      <article class="share-article rich" id="s-body"></article>
    </div>

    <!-- 不存在 -->
    <div id="notfound" class="hidden">
      <div class="share-404">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <p>分享不存在或已被关闭</p>
      </div>
    </div>

    <div class="share-foot" id="foot">由 <b>记事簿</b> · 私有化部署 提供</div>
  </div>

  <!-- 主题切换浮动按钮 -->
  <button class="icon-btn theme-btn theme-float" type="button" title="切换主题"></button>

  <script src="/share.js"></script>
</body>
</html>
